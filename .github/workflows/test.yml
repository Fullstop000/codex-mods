name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
